    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.6
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - default
      - br-sync-dev-net

volumes:
  n8n_data:

networks:
  br-sync-dev-net:
